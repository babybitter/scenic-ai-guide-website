server {
    listen 80;
    listen [::]:80;
    server_name docs.shuzhiyouzong.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.shuzhiyouzong.cn;

    root /var/www/scenic-ai-guide-docs/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/docs.shuzhiyouzong.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.shuzhiyouzong.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /docs;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
